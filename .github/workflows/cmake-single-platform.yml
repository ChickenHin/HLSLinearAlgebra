name: HLS Linear Algebra CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CC: gcc-12
  CXX: g++-12

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          gcc-12 \
          g++-12 \
          libgtest-dev \
          libeigen3-dev
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_CXX_COMPILER=${{env.CXX}} \
          -DBUILD_TESTS=ON \
          -DBUILD_HLS_TESTS=OFF \
          -DBUILD_BENCHMARKS=OFF
    
    - name: Build
      run: |
        cmake --build build --config ${{env.BUILD_TYPE}} -- -j$(nproc)
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --timeout 30 -C ${{env.BUILD_TYPE}}
